<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapSell - Product Photo Enhancer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #222; padding: 16px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 12px 0 4px; }
  p.sub { color: #666; font-size: 14px; margin-bottom: 16px; }
  .upload-box { border: 2px dashed #ccc; border-radius: 12px; padding: 32px 16px; text-align: center; background: white; cursor: pointer; }
  .upload-box:hover { border-color: #000; }
  #preview-area { display: none; margin-top: 16px; }
  .compare { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: white; }
  .compare img { width: 100%; display: block; }
  .badge { display: inline-block; font-size: 12px; background: #000; color: #fff; padding: 4px 10px; border-radius: 20px; margin: 8px 4px 8px 0; }
  button { width: 100%; padding: 14px; font-size: 16px; border: none; border-radius: 12px; background: #000; color: #fff; margin-top: 12px; cursor: pointer; }
  button:disabled { background: #ccc; }
  button.secondary { background: #fff; color: #000; border: 1px solid #ddd; }
  .credits { text-align: center; font-size: 13px; color: #666; margin-top: 12px; }
  .loader { text-align: center; padding: 20px; display: none; }
</style>
</head>
<body>
  <h1>SnapSell ✨</h1>
  <p class="sub">One-tap white background + enhancement for Meesho, Instagram sellers.</p>

  <div class="upload-box" id="uploadBox">
    📸 Tap to upload product photo
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="loader" id="loader">Enhancing... please wait ⏳</div>

  <div id="preview-area">
    <div>
      <span class="badge">Before</span><span class="badge" style="background:#0a7a42">After - Ready to sell</span>
    </div>
    <div class="compare">
      <img id="beforeImg" alt="before">
    </div>
    <div class="compare" style="margin-top:8px">
      <img id="afterImg" alt="after">
    </div>
    <button id="downloadBtn">Download HD Photo</button>
    <button class="secondary" id="newBtn">Enhance another photo</button>
  </div>

  <div class="credits" id="creditsText"></div>

  <script>
    const API_URL = "http://localhost:8000/enhance"; // change when deployed
    const uploadBox = document.getElementById('uploadBox');
    const fileInput = document.getElementById('fileInput');
    const loader = document.getElementById('loader');
    const previewArea = document.getElementById('preview-area');
    const beforeImg = document.getElementById('beforeImg');
    const afterImg = document.getElementById('afterImg');
    const creditsText = document.getElementById('creditsText');
    let afterBlobUrl = null;

    function getCredits() {
      let c = localStorage.getItem('snapsell_credits');
      if (c === null) { c = 5; localStorage.setItem('snapsell_credits', c); }
      return parseInt(c);
    }
    function setCredits(c) { localStorage.setItem('snapsell_credits', c); updateCredits(); }
    function updateCredits() { creditsText.textContent = `Free credits left: ${getCredits()} / 5`; }
    updateCredits();

    uploadBox.onclick = () => fileInput.click();
    document.getElementById('newBtn').onclick = () => {
      previewArea.style.display = 'none';
      uploadBox.style.display = 'block';
      fileInput.value = '';
    };
    document.getElementById('downloadBtn').onclick = () => {
      if (!afterBlobUrl) return;
      const a = document.createElement('a');
      a.href = afterBlobUrl;
      a.download = 'snapsell-enhanced.jpg';
      a.click();
    };

    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (getCredits() <= 0) {
        alert('Free credits over! Pay Rs 199 for 100 photos on UPI to continue.');
        return;
      }
      beforeImg.src = URL.createObjectURL(file);
      uploadBox.style.display = 'none';
      loader.style.display = 'block';

      const form = new FormData();
      form.append('file', file);

      try {
        const res = await fetch(API_URL, { method: 'POST', body: form });
        if (!res.ok) throw new Error('Enhance failed');
        const blob = await res.blob();
        afterBlobUrl = URL.createObjectURL(blob);
        afterImg.src = afterBlobUrl;
        loader.style.display = 'none';
        previewArea.style.display = 'block';
        setCredits(getCredits() - 1);
      } catch (err) {
        loader.style.display = 'none';
        uploadBox.style.display = 'block';
        alert('Something went wrong. Make sure backend is running on localhost:8000');
      }
    };
  </script>
</body>
</html>
